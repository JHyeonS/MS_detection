test:
  batch_size: 16
  num_workers: 4
  pin_memory: true

  # optional
  # checkpoint_path: "./runs/hpo_stage2_reconst/finetune/your_experiment/best.pt"

  # threshold policy
  # - val loader가 있으면 아래 threshold들은 자동으로 val에서 결정됨
  # - val loader가 없을 때만 수동 threshold 사용
  anomaly_score_threshold: null
  fc_prob_threshold: null

data:
  test_csv: "test.csv"

  normalize: "robust"
  add_channel_dim: true
  return_meta: true