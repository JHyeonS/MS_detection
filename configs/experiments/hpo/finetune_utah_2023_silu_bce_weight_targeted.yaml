hpo:
  name: "finetune_utah_2023_silu_bce_weight_targeted"
  base_cfg: "configs/train/base_utah_2023_arch_best_silu.yaml"
  stage_cfg: "configs/train/final_utah_2023_best_silu.yaml"
  output_root: "./runs/hpo/finetune_utah_2023_silu_bce_weight_targeted"
  metric: "best_metric"
  mode: "max"
  seed: 42
  max_trials: 9

  pretrain:
    enabled: false

  fixed_overrides:
    paths:
      run_root: "./runs/hpo/finetune_utah_2023_silu_bce_weight_targeted"
    train:
      monitor: "balanced_acc"
      monitor_mode: "max"
      optimizer: "adamw"
      use_pretrained_encoder: true
      pretrained_encoder_path: "./runs/final/utah_2023_best/pretrain/base_utah_2023/best_encoder.pt"
      center_mode: "target_noise"
      cls_loss_weight: 1.0
      bce_pos_weight: 1.0
      anomaly_pos_weight: 1.0
      anomaly_neg_weight: 1.0
      use_amp: true
      freeze_encoder: false
      batch_size: 16
      eval_batch_size: 32
      weight_decay: 0.0001
      early_stopping_patience: 20
      early_stopping_min_delta: 0.0
      early_stopping_warmup_epochs: 0

  search_space:
    train:
      lr: [0.001]
      bce_neg_weight: [1.25, 1.5, 1.75]
      anomaly_loss_weight: [0.05, 0.1, 0.2]
