seed: 42
device:
  type: cuda
  ids:
  - 0
paths:
  run_root: ./runs/base_utah_2023
data:
  experiment: base_utah_2023__train
  split_dir: ./data/0406/metadata/experiments/stage1_utah_2023_only
  num_workers: 4
  pin_memory: true
  normalize: robust
  preprocess:
    detrend: true
    bandpass: true
    bandpass_low: 3
    bandpass_high: 50
    sampling_rate: 2000
model:
  encoder:
    in_channels: 1
    num_layers: 6
    base_channels: 32
    latent_dim: 1024
    norm: bn
    act: relu
    dropout: 0.1
  cae:
    mirror_decoder: true
    final_act: identity
