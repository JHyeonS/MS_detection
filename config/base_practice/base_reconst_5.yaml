seed: 42
device: 
  type: "cuda"
  ids : [3]

paths:
  run_root: "./runs/0315_reconst"


data:
  experiment: "stage3_utah_to_pohang"
  split_dir: "./data/0312/metadata/experiments/stage3_utah_to_pohang"
  num_workers: 4
  pin_memory: true
  normalize: "robust"

  preprocess:
    detrend: true
    bandpass: true
    bandpass_low: 5
    bandpass_high: 80
    sampling_rate: 1000

model:
  encoder:
    in_channels: 1
    num_layers: 5
    base_channels: 32
    latent_dim: 256
    norm: "bn"
    act: "relu"
    dropout: 0.0

  cae:
    mirror_decoder: true
    final_act: "identity"