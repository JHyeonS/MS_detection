data:
  train_csv: "train.csv"
  val_csv: "val.csv"
  test_csv: "test.csv"

  normalize: "robust"
  add_channel_dim: true
  return_meta: false

train:
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  pin_memory: true
  drop_last: true
  freeze_encoder: true

  seed: 42
  labeled_fraction: 1.0
  balance_fraction_by_class: true
  min_samples_per_class: 1
  weighted_sampling: false

  label_map:
    0: 0
    1: 1

  epochs: 150
  lr: 1e-4
  weight_decay: 1e-2
  optimizer: "adamw"
  use_amp: true
  grad_clip: 1.0

  cls_loss_weight: 1.0
  anomaly_loss_weight: 0.01
  lambda_anomaly: 0.01
  eta: 1.0
  monitor: "loss"
  monitor_mode: "min"
  early_stopping_patience: 20

  # stage1 pretrained encoder 사용을 전제로 함.
  # trainer_finetune.py가 명시 경로를 읽을 수 있으면 아래를 사용하고,
  # 아니면 run_root/pretrain/<experiment>/best.pt 규약을 사용.
  pretrained_checkpoint: null
