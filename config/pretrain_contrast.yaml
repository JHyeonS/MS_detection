pretrain:
  mode: "contrast"

  epochs: 150
  lr: 1e-3
  weight_decay: 1e-5
  optimizer: "adamw"
  use_amp: true
  grad_clip: 1.0

  temperature: 0.1

  proj_hidden_dim: 256
  proj_dim: 128
  proj_use_bn: false

  encoder_dropout: 0.0

data:
  pretrain_csv: "pretrain.csv"
  allowed_labels: [0, 1, 2]
  add_channel_dim: true
  normalize: "robust"
  num_workers: 4
  pin_memory: true

  pad_value: 0.0

  crop_mode:
    train: "random"
    eval: "center"