data:
  train_csv: "train.csv"
  val_csv: "val.csv"

  normalize: "robust"
  add_channel_dim: true
  return_meta: false

train:
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  pin_memory: true
  drop_last: true

  seed: 42
  labeled_fraction: 1.0
  balance_fraction_by_class: true
  min_samples_per_class: 1
  weighted_sampling: false

  label_map:
    0: 0
    1: 1

  epochs: 150
  lr: 1e-4
  wd: 1e-2
  optimizer: "adamw"
  use_amp: true
  grad_clip: 1.0

  lambda_anomaly: 0.1
  eta: 1.0
  monitor: "loss"