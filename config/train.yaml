data:
  train_csv: "./data/0312/metadata/experiments/stage1_pohang_only/train.csv"
  val_csv: "./data/0312/metadata/experiments/stage1_pohang_only/val.csv"

  normalize: "robust"
  add_channel_dim: true
  return_meta: false

train:
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  pin_memory: true
  drop_last: true

  seed: 42
  labeled_fraction: 1.0
  balance_fraction_by_class: true
  min_samples_per_class: 1
  weighted_sampling: false

  label_map:
    0: 0
    1: 1