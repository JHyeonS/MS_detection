data:
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  normalize: robust
  add_channel_dim: true
  return_meta: false
train:
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  pin_memory: true
  drop_last: true
  freeze_encoder: false
  seed: 42
  use_labeled_fraction: true
  labeled_fraction: 1.0
  balance_fraction_by_class: true
  min_samples_per_class: 1
  fraction_seed: 42
  weighted_sampling: false
  label_map:
    0: 0
    1: 1
  use_pretrained_encoder: true
  pretrained_encoder_path: null
  center_mode: target_noise
  center_update: every_epoch
  epochs: 150
  lr: 0.0003
  weight_decay: 0.01
  optimizer: adamw
  use_amp: true
  grad_clip: 1.0
  cls_loss_weight: 1.0
  anomaly_loss_weight: 0.1
  lambda_anomaly: 0.1
  eta: 1.0
  monitor: loss
  monitor_mode: min
  early_stopping_patience: 20
